name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (preinstalled on the runner)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug 2>&1 | tee build.log

      - name: Save error log to the ci-log branch (so it can be read without GitHub login)
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -200 > errors.txt || true
          tail -80 build.log >> errors.txt
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null
          git add -f errors.txt
          git commit -m "Build ${{ github.run_number }} failed"
          git push -f origin ci-log

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/helio-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: helio-apk
          path: out/*.apk

      - name: Publish release (download link for the phone)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" out/*.apk \
            --title "Helio build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}. Install on the phone: open this page on the Fold, tap the .apk." \
            --latest
